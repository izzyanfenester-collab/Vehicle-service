
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate JavaScript syntax
        run: |
          python3 -c "import pathlib,re; h=pathlib.Path('app/src/main/assets/index.html').read_text(); [pathlib.Path('/tmp/vehicle-ui-'+str(i)+'.js').write_text(x) for i,x in enumerate(re.findall(r'<script[^>]*>([\s\S]*?)</script>',h))]"
          for script in /tmp/vehicle-ui-*.js; do node --check "$script"; done
          node --check app/src/main/assets/garage.js
          node --check app/src/main/assets/garage-fixes.js

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Vehicle-Service-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
