<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Çar Service</title><style>
:root{color-scheme:light;--blue:#1458d1;--ink:#17243c;--grey:#69778b;--bg:#f3f6fb;--border:#e0e6ee}*{box-sizing:border-box}body{font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0}header{background:linear-gradient(120deg,#102b58,#2067dd);color:white;padding:22px 18px 30px}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;opacity:.85}main{padding:12px;max-width:760px;margin:-15px auto 85px}section,.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #10254a08}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}h2{margin:0 0 12px;font-size:17px}h3{margin:6px 0;font-size:15px}small,.muted{color:var(--grey)}label{display:block;margin:12px 0 5px;font-weight:650;font-size:13px}input,select,textarea{width:100%;border:1px solid #ced8e5;border-radius:10px;padding:11px;font:inherit;background:white;color:#1e2b45}input[type=checkbox]{width:auto}button{border:0;border-radius:10px;background:var(--blue);color:white;padding:11px 15px;font-weight:700;font-size:14px;cursor:pointer}button.secondary{background:#e9f0ff;color:#15428f}button.danger{background:#fbe9e8;color:#a12722}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>*{min-width:0}.vehicle{display:flex;align-items:center;justify-content:space-between;text-align:left;background:#fff;border:1px solid var(--border);padding:12px;border-radius:12px;width:100%;margin:7px 0;color:var(--ink)}.vehicle.active{outline:2px solid var(--blue)}.pill{background:#ebf2ff;color:#174c9b;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:750}.pill.warn{background:#ffebd9;color:#a44f00}.pill.late{background:#ffe2e2;color:#af2222}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #eef1f7;padding:10px 0}.line:last-child{border:0}.line>div{flex:1}nav{padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--border);z-index:5}nav button{touch-action:manipulation;min-height:62px;flex:1;border-radius:0;background:white;color:#49627f;padding:11px 2px;font-size:12px}nav button.sel{color:var(--blue);background:#eaf2ff}.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary>div{border:1px solid var(--border);border-radius:11px;padding:10px;text-align:center;font-size:12px}.summary strong{display:block;font-size:17px}.notice{font-size:12px;color:#546780;background:#eef4ff;padding:10px;border-radius:10px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{flex:1}input[type="file"]{font-size:12px} @media(max-width:360px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>🚘 Çar Service</h1><p>Service tracking for up to 5 vehicles • Offline</p></header><main>
<div id="home"></div><div id="vehiclePage" class="hidden"></div><div id="recordPage" class="hidden"></div><div id="settingsPage" class="hidden"></div>
</main><nav><button data-page="home" class="sel">🏠<br>Home</button><button data-page="vehiclePage">🚗<br>Vehicles</button><button data-page="recordPage">🧰<br>Service Records</button><button data-page="settingsPage">⚙️<br>Settings</button></nav>
<script>
'use strict';
const KEY='my-vehicle-service-v1';
const carBrands=['Perodua','Proton','Toyota','Honda','Mitsubishi','Nissan','Mazda','Hyundai','Kia','Ford','Isuzu','Suzuki','Subaru','Volkswagen','Mercedes-Benz','BMW','Audi','Volvo','Peugeot','Renault','Chery','BYD','Tesla','GWM','Haval','Jaecoo','Omoda','MG','Lexus','Land Rover','Jeep','Mini','Porsche','Jaguar','Infiniti','Chevrolet','Citroen','Fiat','Geely','Changan','GAC','Neta','Ora','Smart','Lamborghini','Ferrari','Bentley','Rolls-Royce','Other'];
const motoBrands=['Honda','Yamaha','Modenas','SYM','Benelli','Kawasaki','Suzuki','Aveta','WMoto','Yadea','CFMoto','Ducati','BMW Motorrad','KTM','Triumph','Royal Enfield','Vespa','Piaggio','Aprilia','Harley-Davidson','Husqvarna','QJMotor','Brixton','Kymco','Demak','Zontes','Other'];
const models={Perodua:['Axia','Bezza','Myvi','Alza','Aruz','Ativa','Kancil','Kelisa','Viva','Kenari','Nautica','Rusa'],Proton:['Saga','Persona','Iriz','Exora','X50','X70','X90','S70','Wira','Waja','Preve','Suprima S','Inspira','Satria','Gen-2','Perdana','Iswara','e.MAS 7'],Toyota:['Vios','Yaris','Corolla','Corolla Cross','Camry','Hilux','Fortuner','Innova','Avanza','Veloz','Alphard','Vellfire','Harrier','RAV4','Hiace','Land Cruiser'],Honda:['City','Civic','Accord','Jazz','HR-V','CR-V','BR-V','WR-V','Odyssey','RS150R','RS-X','Wave 110','Wave 125','EX5','Dash 125','Vario 125','Vario 160','ADV 160','PCX','CBR150R','CB650R','Forza 250'],Mitsubishi:['Xpander','Triton','Outlander','ASX','Lancer','Pajero Sport','Grandis','Attrage'],Nissan:['Almera','Serena','Navara','X-Trail','Sylphy','Teana','Grand Livina','Leaf'],Mazda:['Mazda2','Mazda3','Mazda6','CX-3','CX-5','CX-8','CX-30','CX-60','BT-50'],Yamaha:['Y15ZR','Y16ZR','135LC','LC135','NVX','NMAX','Ego','Ego Avantiz','Lagend 115Z','MT-15','R15','XMAX','MT-25'],Modenas:['Kriss 110','Kriss 125','Elegan 250','Pulsar NS200','Dominar D400','Karisma 125','Z15GT'],SYM:['VF3i','Husky 150','Jet 14','Cruisym 250'],Kawasaki:['Ninja 250','Ninja 400','Z250','Z650','Versys 650','ZX-25R'],Suzuki:['Raider R150','GSX-R150','V-Strom 250','Burgman Street 125','Swift','Vitara','Jimny','Ertiga']};
const catalog=[
['engine_oil','Engine oil',10000,6,'Replace','minor','all'],['oil_filter','Engine oil filter',10000,6,'Replace','minor','car'],['air_filter','Engine air filter',20000,12,'Inspect / replace when needed','minor','all'],['cabin_filter','A/C cabin filter',20000,12,'Inspect / replace','minor','car'],['brake_check','Brakes, pads and rotors',10000,6,'Inspect','minor','all'],['tyre_check','Tyre tread, pressure and condition',10000,6,'Inspect','minor','all'],['tyre_rotate','Tyre rotation',10000,6,'Follow tyre type and rotation pattern','minor','car'],['wheel_alignment','Wheel alignment',10000,12,'Inspect if pulling, uneven tyre wear or after pothole impact','condition','car'],['wheel_balance','Wheel balancing',10000,12,'If steering vibrates or tyres were replaced','condition','car'],['ac_filter','A/C performance and cooling',20000,12,'Inspect cooling, pressure and leaks','condition','car'],['ac_flush','A/C flushing',0,0,'Only if contamination or repairs justify it; not routine service','condition','car'],['brake_fluid','Brake fluid',40000,24,'Test / replace per manufacturer manual','major','all'],['coolant','Engine coolant',40000,24,'Check model-specific specifications and intervals','major','all'],['spark_plug','Spark plugs',40000,24,'Iridium plugs can last longer','major','all'],['gear_oil','Transmission oil / CVT / ATF',40000,24,'Follow transmission type and manufacturer manual','major','car'],['fuel_filter','Fuel filter',40000,24,'Follow specifications and symptoms','major','all'],['belt','Drive belt / timing belt / chain',60000,48,'Inspect according to engine design','major','car'],['battery','Battery, terminals and charging',10000,12,'Inspect / replace based on test','condition','all'],['suspension','Suspension, mounts and steering',20000,12,'Inspect for wear and leaks','condition','all'],['chain','Drive chain and sprockets',1000,1,'Clean, lubricate and inspect for wear','condition','moto'],['chain_tension','Drive chain tension',1000,1,'Check manufacturer manual','condition','moto'],['fork','Fork oil & fork seal',20000,24,'Inspect / replace per manual','major','moto'],['clutch','Clutch and cable',10000,12,'Inspect and adjust','minor','moto'],['valve','Valve clearance',20000,24,'Follow model-specific schedule','major','moto'],['wheel_bearing','Wheel bearings',20000,12,'Inspect for looseness / noise','condition','all'],['lights','Lights, horn and wipers',10000,6,'Inspect; wipers on cars only','minor','all']];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!state||!Array.isArray(state.vehicles)){state={vehicles:Array(5).fill(null),records:[],customIntervals:{}}}while(state.vehicles.length<5)state.vehicles.push(null);state.vehicles=state.vehicles.slice(0,5);state.records=state.records||[];state.customIntervals=state.customIntervals||{};
let slot=0,page='home';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));try{window.CarServiceNotifier?.syncSchedules?.(JSON.stringify(state))}catch(e){console.warn('Notification schedule sync failed',e)}};const iso=d=>{const x=new Date(d);return isNaN(x)?'':x.toISOString().slice(0,10)};const addMonths=(str,n)=>{if(!str)return '';const [y,m,d]=str.split('-').map(Number);let date=new Date(y,m-1+n,1);const day=Math.min(d,new Date(date.getFullYear(),date.getMonth()+1,0).getDate());return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(day).padStart(2,'0')].join('-')};const dayDiff=s=>s?Math.ceil((new Date(s+'T12:00:00')-new Date(new Date().toDateString()))/864e5):null;
const typeText=t=>t==='moto'?'Motorcycle':'Car';const opt=(arr,value='')=>arr.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('');
function due(v,item){const [id,name,km,months,act,cat]=item;const own=state.customIntervals[v.slot+'|'+id];const useKm=own?.km??km,useMo=own?.months??months;const rec=state.records.filter(r=>r.slot===v.slot&&r.items.includes(id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];const baseDate=rec?.date||v.lastDate||'';const baseKm=rec?.km??v.lastKm;const date=useMo&&baseDate?addMonths(baseDate,useMo):'';const mileage=useKm&&baseKm!==''&&baseKm!=null?Number(baseKm)+Number(useKm):null;const remKm=mileage!=null&&v.currentKm!==''?mileage-Number(v.currentKm):null;const remDay=dayDiff(date);const overdue=(remKm!=null&&remKm<=0)||(remDay!=null&&remDay<=0);const soon=!overdue&&((remKm!=null&&remKm<=1000)||(remDay!=null&&remDay<=30));return {date,mileage,remKm,remDay,overdue,soon,category:cat};}
function list(v){return catalog.filter(x=>x[6]==='all'||x[6]===v.type).map(x=>({item:x,...due(v,x)}))}
function guessMajor(v){const ls=list(v).filter(x=>x.category==='major'&&(x.overdue||x.soon));return ls.length?'Major service (important items due soon)':'Minor service (routine maintenance)'}
function renderHome(){const filled=state.vehicles.filter(Boolean);let past=0,soon=0;filled.forEach(v=>list(v).filter(x=>x.category!=='condition').forEach(x=>{if(x.overdue)past++;else if(x.soon)soon++}));$('home').innerHTML=`<section><h2>Service Dashboard</h2><div class="summary"><div><strong>${filled.length}/5</strong>Vehicles</div><div><strong>${past}</strong>Overdue items</div><div><strong>${soon}</strong>Items due soon</div></div><p class="notice">Service recommendations are estimates. Follow mileage or time, whichever comes first, and always check the official manual for your exact model and year.</p></section><section><div class="head"><h2>5 Vehicle Slots</h2><button class="secondary" onclick="navigate('vehiclePage')">Manage</button></div>${state.vehicles.map((v,i)=>`<button class="vehicle ${i===slot?'active':''}" onclick="slot=${i};navigate('vehiclePage')"><span><strong>${i+1}. ${v?esc(v.brand+' '+v.model):'Add vehicle'}</strong><br><small>${v?esc((v.plate||typeText(v.type))+' • '+v.currentKm+' km'):'Empty slot'}</small></span><span class="pill">${v?'Open':'+'}</span></button>`).join('')}</section>${filled.map(v=>{const l=list(v).filter(x=>x.category!=='condition');const od=l.filter(x=>x.overdue).length;const sn=l.filter(x=>x.soon).length;return `<section><div class="head"><strong>${esc(v.brand+' '+v.model)}</strong><span class="pill ${od?'late':sn?'warn':''}">${od?od+' overdue':sn?sn+' due soon':'Monitor'}</span></div><small>${esc(v.plate)} • ${v.currentKm} km</small><p><strong>${guessMajor(v)}</strong></p><small>Next service: ${esc(v.nextDate||'Not set')} • ${v.nextKm||'—'} km</small></section>`}).join('')}`}
function renderVehicle(){const v=state.vehicles[slot];$('vehiclePage').innerHTML=`<section><h2>Select vehicle slot</h2><div class="grid">${state.vehicles.map((x,i)=>`<button class="${i===slot?'':'secondary'}" onclick="slot=${i};renderVehicle()">${i+1} ${x?esc(x.plate||x.model):'Empty'}</button>`).join('')}</div></section><section><h2>${v?'Update':'Add'} Vehicles ${slot+1}</h2><form id="vehicleForm"><label>Vehicle type</label><select id="type" onchange="updateBrands()"><option value="car" ${v?.type!=='moto'?'selected':''}>Car</option><option value="moto" ${v?.type==='moto'?'selected':''}>Motorcycle</option></select><label>Brand</label><select id="brand" onchange="updateModels()"></select><label>Model (select or enter another)</label><select id="modelSelect" onchange="toggleCustom()"></select><input id="customModel" placeholder="Enter model name" style="margin-top:8px"><div class="grid"><div><label>Registration plate</label><input id="plate" value="${esc(v?.plate||'')}" placeholder="JXX 1234"></div><div><label>Year</label><input id="year" type="number" min="1950" max="2100" value="${esc(v?.year||'')}" placeholder="2023"></div></div><div class="grid"><div><label>Current odometer (km)</label><input id="currentKm" type="number" min="0" value="${esc(v?.currentKm??'')}" required></div><div><label>Last service odometer (km)</label><input id="lastKm" type="number" min="0" value="${esc(v?.lastKm??'')}"></div></div><label>Last service date</label><input id="lastDate" type="date" value="${esc(v?.lastDate||'')}"><div class="grid"><div><label>Next service date (manual)</label><input id="nextDate" type="date" value="${esc(v?.nextDate||'')}"></div><div><label>Next service mileage (manual)</label><input id="nextKm" type="number" min="0" value="${esc(v?.nextKm||'')}"></div></div><h3 style="margin-top:18px">Road Tax & Insurance</h3><div class="grid"><div><label>Road tax expiry date</label><input id="roadTaxExpiry" type="date" value="${esc(v?.roadTaxExpiry||'')}"></div><div><label>Insurance expiry date</label><input id="insuranceExpiry" type="date" value="${esc(v?.insuranceExpiry||'')}"></div></div><p class="notice">The dashboard shows Expiring Soon 30 days before each expiry and Expired after the date. Reminders appear when the app is opened; this version does not send background notifications.</p><label>Official service manual URL (optional)</label><input id="manualLink" type="url" value="${esc(v?.manualUrl||'')}" placeholder="https://example.com/manual.pdf"><p class="notice">For reliable reminders, enter your last service date and mileage. Follow the manufacturer manual for the next service interval.</p><div class="actions"><button type="submit">Save vehicle</button>${v?`<button type="button" class="danger" onclick="removeVehicle()">Delete slot</button>`:''}</div></form></section>${v?`<section><h2>Suggested service</h2><strong>${guessMajor(v)}</strong><div class="line"><div>Manual date: ${esc(v.nextDate||'—')}<br>Manual mileage: ${esc(v.nextKm||'—')} km</div></div>${list(v).filter(x=>x.overdue||x.soon).map(x=>`<div class="line"><div><strong>${esc(x.item[1])}</strong><br><small>${esc(x.item[4])}</small></div><span class="pill ${x.overdue?'late':'warn'}">${x.overdue?'Due':'Soon'}</span></div>`).join('')||'<p class="muted">No items are due based on available data.</p>'}</section>`:''}`;updateBrands(v?.brand,v?.model);$('vehicleForm').onsubmit=e=>{e.preventDefault();const type=$('type').value;const brand=$('brand').value;const model=$('modelSelect').value==='__other__'?$('customModel').value.trim():$('modelSelect').value;if(!model){alert('Please enter a vehicle model.');return}const currentKm=$('currentKm').value;const lastKm=$('lastKm').value;if(lastKm!==''&&Number(lastKm)>Number(currentKm)){alert('Last service mileage cannot exceed the current odometer.');return}state.vehicles[slot]={slot,type,brand,model,manualUrl:$('manualLink').value.trim(),roadTaxExpiry:$('roadTaxExpiry').value,insuranceExpiry:$('insuranceExpiry').value,plate:$('plate').value.trim(),year:$('year').value,currentKm:Number(currentKm),lastKm:lastKm===''?'':Number(lastKm),lastDate:$('lastDate').value,nextDate:$('nextDate').value,nextKm:$('nextKm').value};save();render();alert('Vehicle saved.')};}
function updateBrands(savedBrand,savedModel){const type=$('type').value,all=type==='moto'?motoBrands:carBrands;const brand=savedBrand&&all.includes(savedBrand)?savedBrand:all[0];$('brand').innerHTML=opt(all,brand);updateModels(savedModel)}function updateModels(savedModel){const brand=$('brand').value;let all=(models[brand]||[]).filter(x=>$('type').value==='moto'? /^(RS|Wave|EX5|Dash|Vario|ADV|PCX|CBR|CB650|Forza|Y|LC|NVX|NMAX|Ego|Lagend|MT|R15|XMAX|Kriss|Elegan|Pulsar|Dominar|Karisma|Z15|VF3i|Husky|Jet|Cruisym|Ninja|Z250|Z650|Versys|ZX|Raider|GSX|V-Strom|Burgman)/i.test(x):!/^(RS150|RS-X|Wave|EX5|Dash|Vario|ADV 160|PCX|CBR|CB650|Forza)/i.test(x));if(!all.length)all=['Other'];const selected=savedModel&&all.includes(savedModel)?savedModel:'__other__';$('modelSelect').innerHTML=opt(all,selected)+`<option value="__other__" ${selected==='__other__'?'selected':''}>Other model / enter manually</option>`;$('customModel').value=savedModel&&selected==='__other__'?savedModel:'';toggleCustom()}function toggleCustom(){$('customModel').classList.toggle('hidden',$('modelSelect').value!=='__other__')}
function removeVehicle(){if(!confirm('Delete this vehicle and all service records in this slot?'))return;state.vehicles[slot]=null;state.records=state.records.filter(r=>r.slot!==slot);for(const k in state.customIntervals)if(k.startsWith(slot+'|'))delete state.customIntervals[k];save();render()}
function renderRecords(){const v=state.vehicles[slot];$('recordPage').innerHTML=`<section><h2>Service Records & Checklist</h2><label>Select vehicle</label><select id="rSlot" onchange="slot=Number(this.value);renderRecords()">${state.vehicles.map((x,i)=>`<option value="${i}" ${i===slot?'selected':''}>${i+1}. ${esc(x?x.brand+' '+x.model:'Empty slot')}</option>`).join('')}</select></section>${!v?'<section>Add a vehicle on the Vehicles tab first.</section>':`<section><h2>${esc(v.brand+' '+v.model)}</h2><p><strong>${guessMajor(v)}</strong></p><div class="notice">The checklist covers routine, major and condition-based items. Recorded replacements are tracked from their actual service date and mileage.</div><label>Service date</label><input id="recDate" type="date" value="${iso(new Date())}"><label>Service odometer (km)</label><input id="recKm" type="number" min="0" value="${v.currentKm}"><label>Actual service type</label><select id="recType"><option>Minor</option><option>Major</option><option>Inspection / other work</option></select><label>Workshop name</label><input id="workshop" placeholder="Example: Mitsubishi Service Centre"><div class="grid"><div><label>Total cost (RM)</label><input id="cost" type="number" min="0" step="0.01" placeholder="0.00"></div><div><label>Receipt number (optional)</label><input id="receipt" placeholder="Reference"></div></div><label>Notes</label><textarea id="notes" rows="2" placeholder="Engine oil, problems found, replaced parts..."></textarea><h3 style="margin-top:18px">Select serviced / replaced items</h3><div class="actions"><button class="secondary" onclick="checkGroup('all')">Select all</button><button class="secondary" onclick="checkGroup('none')">Clear selection</button></div>${list(v).map(x=>`<div class="line"><input type="checkbox" class="itemCheck" value="${x.item[0]}"><div><strong>${esc(x.item[1])}</strong><br><small>${esc(x.item[4])}</small><br><small>${x.date?'Estimated: '+x.date+' • ':''}${x.mileage!=null?x.mileage+' km':''}</small></div><span class="pill ${x.overdue?'late':x.soon?'warn':''}">${x.overdue?'DUE':x.soon?'DUE SOON':x.category==='major'?'Major':x.category==='minor'?'Minor':'Condition-based'}</span></div>`).join('')}<div class="actions"><button onclick="saveRecord()">Save service record</button></div></section><section><h2>Service history</h2>${state.records.filter(r=>r.slot===slot).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="line"><div><strong>${esc(r.date)} • ${esc(r.type)}</strong><br><small>${r.km} km • RM${Number(r.cost||0).toFixed(2)} • ${esc(r.workshop)}</small><br><small>${esc(r.items.map(id=>catalog.find(x=>x[0]===id)?.[1]||id).join(', ')||'No items')}</small><br><small>${esc(r.notes||'')}</small></div><button class="danger" onclick="deleteRecord('${r.id}')">Delete</button></div>`).join('')||'<p class="muted">No service history yet.</p>'}</section>`}`}
function checkGroup(how){document.querySelectorAll('.itemCheck').forEach(x=>x.checked=how==='all')}
function saveRecord(){const v=state.vehicles[slot];const date=$('recDate').value,km=Number($('recKm').value);if(!date||$('recKm').value===''){alert('Date and odometer are required.');return}if(km<0){alert('Invalid mileage.');return}const items=[...document.querySelectorAll('.itemCheck:checked')].map(x=>x.value);state.records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),slot,date,km,items,type:$('recType').value,workshop:$('workshop').value,cost:$('cost').value,receipt:$('receipt').value,notes:$('notes').value});if(km>Number(v.currentKm))v.currentKm=km;v.lastDate=date;v.lastKm=km;save();render();alert('Service record saved.')}
function deleteRecord(id){if(!confirm('Delete this record?'))return;state.records=state.records.filter(r=>r.id!==id);save();render()}
function renderSettings(){const v=state.vehicles[slot];$('settingsPage').innerHTML=`<section><h2>Settings</h2><p class="notice">Default intervals are estimates only. They depend on engine, fluid, transmission, year and usage. Adjust them to match your manufacturer manual, especially for motorcycles.</p><label>Set intervals for vehicle</label><select id="sSlot" onchange="slot=Number(this.value);renderSettings()">${state.vehicles.map((x,i)=>`<option value="${i}" ${i===slot?'selected':''}>${i+1}. ${esc(x?x.brand+' '+x.model:'Empty slot')}</option>`).join('')}</select>${v?list(v).map(x=>{let own=state.customIntervals[slot+'|'+x.item[0]];return `<div class="line"><div><strong>${esc(x.item[1])}</strong><small style="display:block">${esc(x.item[4])}</small><div class="grid"><div><label>Every km (0 = disabled)</label><input id="km_${x.item[0]}" type="number" min="0" value="${own?.km??x.item[2]}"></div><div><label>Every months (0 = disabled)</label><input id="mo_${x.item[0]}" type="number" min="0" value="${own?.months??x.item[3]}"></div></div></div></div>`}).join('')+`<div class="actions"><button onclick="saveIntervals()">Save intervals</button></div>`:'<p>Add a vehicle to configure intervals.</p>'}</section><section><h2>Backup & Restore</h2><p class="muted">Your vehicle, service, fuel and reminder data is stored locally. Export a backup before uninstalling or changing devices. Receipt image and PDF attachments are stored separately and are not included in this JSON backup.</p><div class="actions"><button onclick="exportData()">Export JSON backup</button><p id="backupExportStatus" class="muted" role="status">Tap Export JSON backup and choose where to save the file.</p></div><label>Import JSON backup</label><input type="file" id="importFile" accept="application/json,.json"><button class="secondary" style="margin-top:8px" onclick="importData()">Import backup</button></section><section><h2>Safety notes</h2><p class="muted">Major/minor classifications are suggestions, not manufacturer instructions. A/C flushing is only recommended when justified by diagnosis. Alignment and balancing depend on tyre/suspension work or symptoms. Some electric vehicles require different maintenance.</p></section>`}
function saveIntervals(){if(!state.vehicles[slot])return;list(state.vehicles[slot]).forEach(x=>{const id=x.item[0],km=Number($('km_'+id).value),months=Number($('mo_'+id).value);if(Number.isFinite(km)&&Number.isFinite(months)&&km>=0&&months>=0)state.customIntervals[slot+'|'+id]={km,months}});save();render();alert('Intervals saved.')}
function exportData(){
 if(!window.CarServiceBackup||typeof window.CarServiceBackup.exportJson!=='function'){
   alert('Android Save As is not available in this app version. Please install the latest Çar Service APK.');
   return;
 }
 try{
   const data=JSON.stringify(state,null,2);
   const d=new Date();
   const number=n=>String(n).padStart(2,'0');
   const name='Car-Service-Backup-'+d.getFullYear()+number(d.getMonth()+1)+number(d.getDate())+'-'+number(d.getHours())+number(d.getMinutes())+'.json';
   const label=document.getElementById('backupExportStatus');
   if(label)label.textContent='Choose a folder and tap Save in the Android file picker.';
   window.CarServiceBackup.exportJson(data,name);
 }catch(error){
   alert('Unable to prepare JSON backup: '+error.message);
 }
}
window.onCarBackupFinished=function(status,message){
 const label=document.getElementById('backupExportStatus');
 if(label)label.textContent=message;
 if(status==='error')console.warn('Backup export failed: '+message);
};
function importData(){const f=$('importFile').files[0];if(!f){alert('Please select a JSON file first.');return}const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);if(!Array.isArray(imported.vehicles)||!Array.isArray(imported.records)||imported.vehicles.length>5)throw Error('Invalid format');if(!confirm('Import will replace your current records. Continue?'))return;state={vehicles:imported.vehicles.concat(Array(5).fill(null)).slice(0,5).map((v,i)=>v?{...v,slot:i}:null),records:imported.records,customIntervals:imported.customIntervals||{},manualSchedules:imported.manualSchedules||{}};save();render();alert('Backup imported successfully.')}catch(e){alert('Invalid backup: '+e.message)}};r.readAsText(f)}
function navigate(p){page=p;render()}function render(){['home','vehiclePage','recordPage','settingsPage'].forEach(x=>$(x).classList.toggle('hidden',x!==page));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('sel',x.dataset.page===page));renderHome();if(page==='vehiclePage')renderVehicle();if(page==='recordPage')renderRecords();if(page==='settingsPage')renderSettings();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));render();
</script>
<script>
/* Service plan and cost estimator 1.1 - all user-facing copy in English. */
(function(){
'use strict';
const scheduleBase={
 xpander:{label:'Xpander 2020–2023 reference schedule',status:'Reference schedule; verify with the handbook for your exact 2023 variant.',url:'https://www.mitsubishi-motors.com.my/maintenance-schedule/'},
 rs:{label:'Honda RS150R published maintenance schedule',status:'Manufacturer reference. Check year-specific details in the manufacturer manual.',url:'https://boonsiewhonda.com.my/wp-content/uploads/2022/07/rs150r-maint-eng.pdf'},
 generic:{label:'General maintenance checklist only',status:'No verified manufacturer schedule loaded for this exact model/year. These items are NOT manufacturer replacement instructions.',url:''}
};
const priceCar={
 engine_oil:[115,230],oil_filter:[20,55],air_filter:[35,120],cabin_filter:[30,100],brake_fluid:[40,110],
 coolant:[60,180],spark_plug:[90,450],gear_oil:[180,430],fuel_filter:[90,600],
 wheel_alignment:[40,100],wheel_balance:[30,80],ac_flush:[180,480],tyre_rotate:[20,60]
};
const priceMoto={
 engine_oil:[25,65],air_filter:[20,65],spark_plug:[12,45],brake_fluid:[20,55],coolant:[25,75],chain:[80,220],
 valve:[40,110],fork:[80,180],wheel_bearing:[25,100],clutch:[20,90]
};
function isXP(v){return v.type==='car'&&v.brand==='Mitsubishi'&&/xpander/i.test(v.model)&&Number(v.year||2023)<2024;}
function isRS(v){return v.type==='moto'&&v.brand==='Honda'&&/^(RS150|RS150R)/i.test(v.model);}
function profile(v){if(isXP(v))return scheduleBase.xpander;if(isRS(v))return scheduleBase.rs;if(v.brand==='Perodua')return {label:'Perodua model/year manual lookup',status:'Find your exact model and year. A verified service schedule is not yet loaded; only general inspection guidance is shown.',url:'https://eownersmanual.perodua.com.my/ourcars'};return scheduleBase.generic;}
function defaultNextMileage(v){const km=Number(v.currentKm||0);const step=isRS(v)?6000:10000;if(isRS(v)&&km<1000)return 1000;return (Math.floor(km/step)+1)*step;}
let previewMileage={};
function milestone(v){
 const m=previewMileage[slot];
 if(Number.isFinite(m)&&m>0)return m;
 const next=Number(v.nextKm);
 return next>Number(v.currentKm||0)?next:defaultNextMileage(v);
}
function aligned(km,interval){return km>0&&Number.isFinite(km)&&km%interval===0;}
function buildPlan(v,at){
 const items=[];const put=(id,action,why)=>{if(!items.some(i=>i.id===id))items.push({id,action,why});};
 const km=Math.round(Number(at||0));let p=profile(v);
 if(p===scheduleBase.xpander){
   if(km===1000||aligned(km,10000)){put('engine_oil','Replace','Every 10,000 km / 6 months');put('oil_filter','Replace','Periodic service');}
   if(aligned(km,20000))put('cabin_filter','Replace','20,000 km reference');
   if(aligned(km,30000))put('air_filter','Replace','30,000 km reference');
   else if(aligned(km,10000))put('air_filter','Inspect','Check air filter condition');
   if(aligned(km,40000))put('brake_fluid','Replace','40,000 km reference');
   if(aligned(km,100000)){put('gear_oil','Replace','ATF at 100,000 km reference; verify variant');put('spark_plug','Replace','Iridium plugs at 100,000 km reference');}
   if(aligned(km,160000))put('coolant','Replace','Super long-life coolant reference');
   if(aligned(km,10000)){put('brake_check','Inspect','Brake safety check');put('tyre_check','Inspect','Tyre safety check');}
 }else if(p===scheduleBase.rs){
   if(km===1000||aligned(km,6000))put('engine_oil','Replace','At 1,000 km then each 6,000 km on published schedule; severe use can require more frequent changes');
   if(aligned(km,6000)){put('brake_check','Inspect','Brake system / pad wear');put('tyre_check','Inspect','Wheels and tyres');put('clutch','Inspect','Clutch operation');}
   if(aligned(km,6000)&&km%18000===6000){put('air_filter','Replace','Air cleaner schedule; check your edition');put('spark_plug','Replace','Spark plug schedule; check your edition');}
   if(aligned(km,12000))put('valve','Inspect','Valve clearance inspection');
   put('chain','Inspect','Honda specifies inspection/lubrication every 500 km');
   if(km===1000)put('tyre_check','Inspect','Initial service inspection');
 }else{
   put('engine_oil','Inspect','Confirm replacement interval in your manual');
   if(v.type==='car'){put('oil_filter','Inspect','Check manual');put('brake_check','Inspect','Safety check');put('tyre_check','Inspect','Safety check');}
   else {put('chain','Inspect','Check if chain-driven');put('brake_check','Inspect','Safety check');}
 }
 return {profile:p,items,at:km,kind:items.some(x=>x.action==='Replace'&&!['engine_oil','oil_filter','cabin_filter'].includes(x.id))?'Major':'Minor'};
}
function costFor(v,id){const prices=v.type==='moto'?priceMoto:priceCar;return prices[id]||[0,0];}
function estimatedCost(v,items,includeLabour=true){
 let low=0,high=0;
 for(const i of items){if(i.action!=='Replace')continue;const p=costFor(v,i.id);low+=p[0];high+=p[1];}
 if(includeLabour){low+=v.type==='moto'?20:55;high+=v.type==='moto'?65:175;}
 return {low,high};
}
function itemName(id){return catalog.find(x=>x[0]===id)?.[1]||id;}
function servicePlanHtml(v){
 const plan=buildPlan(v,milestone(v));const total=estimatedCost(v,plan.items);
 const link=/^https?:\/\//i.test(v.manualUrl||'')?v.manualUrl:plan.profile.url;const official=link?'<a href="'+esc(link)+'" style="color:#1458d1;text-decoration:underline">View manufacturer resource ↗</a>':'<span>Attach the correct booklet when available.</span>';
 return '<section class="servicePlan">'+
 '<h2>📘 Maintenance schedule & cost estimator</h2><p class="notice">'+esc(plan.profile.label)+' — '+esc(plan.profile.status)+'</p>'+
 '<label>Preview service at mileage (km)</label><div class="grid"><input type="number" min="1" id="milestoneInput" value="'+plan.at+'"><button type="button" onclick="setPlanMileage()">Calculate service</button></div>'+
 '<p><strong>'+esc(plan.kind)+' service estimate · RM '+total.low+' – '+total.high+'</strong></p>'+
 '<small>Parts + estimated independent-workshop labour. Indicative Malaysia prices, not a confirmed quote. Inspections may cost extra and other repairs are excluded.</small>'+
 '<h3 style="margin-top:15px">Recommended at '+plan.at.toLocaleString()+' km</h3>'+
 plan.items.map(i=>'<div class="line"><div><strong>'+esc(itemName(i.id))+'</strong><br><small>'+esc(i.why)+'</small></div><span class="pill '+(i.action==='Replace'?'warn':'')+'">'+i.action+'</span></div>').join('')+
 '<p class="notice"><strong>Condition-based only:</strong> wheel alignment, balancing and A/C flushing are not automatic replacements. Inspect and authorise separately if necessary.</p>'+
 '<div class="actions"><button type="button" class="secondary" onclick="addPlanToChecklist()">Select replacements in checklist</button></div>'+
 '<p><small>'+official+'</small></p></section>';
}
window.setPlanMileage=function(){const el=document.getElementById('milestoneInput');if(!el)return;const value=Number(el.value);if(!Number.isFinite(value)||value<=0){alert('Enter a valid mileage.');return;}previewMileage[slot]=value;render();};
window.addPlanToChecklist=function(){page='recordPage';render();const v=state.vehicles[slot];if(!v)return;const plan=buildPlan(v,milestone(v));document.querySelectorAll('.itemCheck').forEach(ch=>{ch.checked=plan.items.some(x=>x.id===ch.value&&x.action==='Replace');});updateSelectionEstimate();};
function selectedEstimate(){
 const v=state.vehicles[slot];if(!v)return null;
 const items=[...document.querySelectorAll('.itemCheck:checked')].map(ch=>({id:ch.value,action:'Replace'}));
 return estimatedCost(v,items);
}
window.updateSelectionEstimate=function(){
 const box=document.getElementById('costPreview');if(!box)return;const t=selectedEstimate();
 if(t)box.textContent='Selected service estimate: RM '+t.low+' – RM '+t.high+' including estimated labour. Edit actual cost when saving.';
};
const oldVehicle=renderVehicle,oldRecords=renderRecords,oldHome=renderHome;
renderVehicle=function(){oldVehicle();const v=state.vehicles[slot];if(v)$('vehiclePage').insertAdjacentHTML('beforeend',servicePlanHtml(v));};
renderRecords=function(){oldRecords();const v=state.vehicles[slot];if(v){$('recordPage').insertAdjacentHTML('beforeend',servicePlanHtml(v));const heading=$('recordPage').querySelector('h3');if(heading){heading.insertAdjacentHTML('beforebegin','<p class="notice" id="costPreview">Select items below to see estimated parts and labour costs.</p>');}updateSelectionEstimate();}};
renderHome=function(){oldHome();const root=$('home');root.insertAdjacentHTML('beforeend','<section><h2>How the estimates work</h2><p class="notice">Maintenance plans are based on validated manufacturer references only where available. Other vehicles use a general checklist until a correct manual is confirmed. Costs are indicative MYR planning ranges, not quotations.</p></section>');};
document.addEventListener('change',function(e){if(e.target&&e.target.classList&&e.target.classList.contains('itemCheck'))updateSelectionEstimate();});
document.querySelector('nav').addEventListener('click',function(e){const b=e.target.closest('button[data-page]');if(!b)return;e.preventDefault();e.stopPropagation();page=b.dataset.page;render();},true);
render();
})();
</script>

<!-- Custom Alignment / A/C Reminders v1.2 -->
<script>
(function() {
  'use strict';

  const reminders = [
    {id:'wheel_alignment', title:'Wheel Alignment', cost:[40,100],
     info:'Condition-based service. You choose the reminder date or mileage; alignment is not automatically needed at every interval.'},
    {id:'ac_flush', title:'A/C Flushing', cost:[180,480],
     info:'Condition-based service. A/C flushing is not routine maintenance unless inspection or system repair justifies it.'}
  ];
  state.manualSchedules = state.manualSchedules && typeof state.manualSchedules === 'object' ? state.manualSchedules : {};
  const scheduleKey = (v,id) => String(v.slot)+'|'+id;
  const scheduleFor = (v,id) => state.manualSchedules?.[scheduleKey(v,id)] || {};
  const currency = n => 'RM '+Number(n).toLocaleString('en-MY',{minimumFractionDigits:0,maximumFractionDigits:2});
  const kmText = n => Number(n).toLocaleString('en-MY')+' km';

  function statusFor(v,item) {
    const s=scheduleFor(v,item.id);
    const nextKm=s.nextKm==null||s.nextKm===''?null:Number(s.nextKm);
    const nextDate=s.nextDate||'';
    const remainingKm=nextKm===null?null:nextKm-Number(v.currentKm||0);
    const remainingDays=nextDate?dayDiff(nextDate):null;
    let type='not-set',label='Not scheduled';
    if(nextDate||nextKm!==null) {
      type=(remainingKm!==null&&remainingKm<=0)||(remainingDays!==null&&remainingDays<=0)?'overdue':
          (remainingKm!==null&&remainingKm<=1000)||(remainingDays!==null&&remainingDays<=30)?'soon':'planned';
      label=type==='overdue'?'Service Due':type==='soon'?'Due Soon':'Scheduled';
    }
    return {s,nextKm,nextDate,remainingKm,remainingDays,type,label};
  }
  function statusDetail(v,item) {
    const st=statusFor(v,item);
    if(st.type==='not-set')return 'Set your own next date or mileage';
    const parts=[];
    if(st.nextDate)parts.push('Target date: '+st.nextDate+(st.remainingDays!==null?' ('+(st.remainingDays>=0?st.remainingDays+' days left':Math.abs(st.remainingDays)+' days overdue')+')':''));
    if(st.nextKm!==null)parts.push('Target mileage: '+kmText(st.nextKm)+' ('+(st.remainingKm>=0?kmText(st.remainingKm)+' left':kmText(Math.abs(st.remainingKm))+' overdue')+')');
    return parts.join(' · ');
  }
  function statusBadge(t) {
    const klass=t==='overdue'?'late':t==='soon'?'warn':'';
    const text=t==='overdue'?'Service Due':t==='soon'?'Due Soon':t==='planned'?'Scheduled':'Not Set';
    return '<span class="pill '+klass+'">'+text+'</span>';
  }
  function message(v,item) {
    const s=statusFor(v,item);
    const money=s.s.estimatedCost==null?'Estimated '+currency(item.cost[0])+' – '+currency(item.cost[1]):'Your budget: '+currency(s.s.estimatedCost);
    return '<div class="line"><div><strong>'+esc(item.title)+'</strong><br><small>'+esc(statusDetail(v,item))+'</small><br><small>'+esc(money)+'</small></div>'+statusBadge(s.type)+'</div>';
  }
  function schedulerSection(v) {
    if(v.type!=='car')return '';
    return '<section class="manual-schedule">'+
      '<h2>🛞 Custom Maintenance Reminders</h2>'+
      '<p class="notice">Set your last and next service date or mileage for Wheel Alignment and A/C Flushing. The app checks both targets whenever opened or when you update the odometer. The earlier target determines the reminder. Due Soon starts within 30 days or 1,000 km.</p>'+
      reminders.map(function(item){
        const s=scheduleFor(v,item.id);
        const value=(field) => s[field] == null ? '' : esc(s[field]);
        const status=statusFor(v,item);
        const id=item.id;
        return '<div class="card" style="box-shadow:none;margin:12px 0;padding:12px">'+
          '<div class="head"><strong>'+esc(item.title)+'</strong>'+statusBadge(status.type)+'</div>'+
          '<p><small>'+esc(item.info)+'</small></p>'+
          '<div class="grid">'+
            '<div><label>Last service date</label><input type="date" id="'+id+'_lastDate" value="'+value('lastDate')+'"></div>'+
            '<div><label>Last service mileage (km)</label><input type="number" min="0" id="'+id+'_lastKm" value="'+value('lastKm')+'"></div>'+
            '<div><label>Next service date</label><input type="date" id="'+id+'_nextDate" value="'+value('nextDate')+'"></div>'+
            '<div><label>Next service mileage (km)</label><input type="number" min="0" id="'+id+'_nextKm" value="'+value('nextKm')+'"></div>'+
            '<div><label>Repeat every months (optional)</label><input type="number" min="0" id="'+id+'_intervalMonths" value="'+value('intervalMonths')+'" placeholder="0 = manual only"></div>'+
            '<div><label>Repeat every km (optional)</label><input type="number" min="0" id="'+id+'_intervalKm" value="'+value('intervalKm')+'" placeholder="0 = manual only"></div>'+
          '</div><label>Estimated cost (RM, optional)</label>'+
          '<input type="number" min="0" step="0.01" id="'+id+'_estimatedCost" value="'+value('estimatedCost')+'" placeholder="'+item.cost[0]+' – '+item.cost[1]+'">'+
          '<p class="notice">'+esc(statusDetail(v,item))+'</p>'+
          '<div class="actions"><button type="button" class="secondary" onclick="calculateManualReminder(\''+id+'\')">Suggest Next</button>'+
          '<button type="button" onclick="saveManualReminder(\''+id+'\')">Save Reminder</button>'+
          '<button type="button" class="secondary" onclick="completeManualReminder(\''+id+'\')">Mark Completed</button></div>'+
          '</div>';
      }).join('')+'</section>';
  }
  window.calculateManualReminder=function(id) {
    const item=reminders.find(x=>x.id===id);
    if(!item)return;
    const lastDate=$(id+'_lastDate').value;
    const lastKm=$(id+'_lastKm').value;
    const months=Number($(id+'_intervalMonths').value||0);
    const kms=Number($(id+'_intervalKm').value||0);
    let calculated=false;
    if(lastDate&&months>0){$(id+'_nextDate').value=addMonths(lastDate,months);calculated=true;}
    if(lastKm!==''&&kms>0){$(id+'_nextKm').value=String(Number(lastKm)+kms);calculated=true;}
    if(!calculated){alert('Enter your last service details and an optional repeat interval, or set the next date/mileage manually.');return;}
    alert('Suggested next service filled in. Tap Save Reminder to enable alerts.');
  };
  window.saveManualReminder=function(id) {
    const v=state.vehicles[slot],item=reminders.find(x=>x.id===id);
    if(!v||!item||v.type!=='car')return;
    const val=(name)=>$(id+'_'+name).value;
    const lastDate=val('lastDate'), lastKm=val('lastKm'), nextDate=val('nextDate'), nextKm=val('nextKm');
    const intervalMonths=val('intervalMonths'),intervalKm=val('intervalKm'),estimatedCost=val('estimatedCost');
    if([lastKm,nextKm,intervalMonths,intervalKm,estimatedCost].some(s=>s!==''&&(!Number.isFinite(Number(s))||Number(s)<0))){alert('Mileage, repeat intervals and costs must be zero or greater.');return;}
    if(lastKm!==''&&Number(lastKm)>Number(v.currentKm||0)){alert('Last service mileage cannot exceed the current odometer. Update the vehicle odometer first.');return;}
    let suggestedDate=nextDate,suggestedKm=nextKm;
    if(!suggestedDate&&lastDate&&Number(intervalMonths)>0)suggestedDate=addMonths(lastDate,Number(intervalMonths));
    if(suggestedKm===''&&lastKm!==''&&Number(intervalKm)>0)suggestedKm=String(Number(lastKm)+Number(intervalKm));
    if(suggestedKm!==''&&lastKm!==''&&Number(suggestedKm)<=Number(lastKm)){alert('Next mileage must be greater than last service mileage.');return;}
    if(!suggestedDate&&suggestedKm===''){alert('Please set a next service date, next mileage, or a repeat interval to activate automatic reminders.');return;}
    state.manualSchedules[scheduleKey(v,id)]={
      lastDate,lastKm:lastKm===''?null:Number(lastKm),
      nextDate:suggestedDate,nextKm:suggestedKm===''?null:Number(suggestedKm),
      intervalMonths:Number(intervalMonths||0),intervalKm:Number(intervalKm||0),
      estimatedCost:estimatedCost===''?null:Number(estimatedCost)
    };
    save();render();alert(item.title+' reminder saved. Your dashboard will show when the service is due.');
  };
  window.completeManualReminder=function(id) {
    const v=state.vehicles[slot],item=reminders.find(x=>x.id===id);
    if(!v||!item)return;
    if(!confirm('Mark '+item.title+' completed today at '+kmText(v.currentKm||0)+'?'))return;
    const s=scheduleFor(v,id);
    const today=iso(new Date());
    const intervalMonths=Number(s.intervalMonths||0),intervalKm=Number(s.intervalKm||0);
    const nextDate=intervalMonths>0?addMonths(today,intervalMonths):'';
    const nextKm=intervalKm>0?Number(v.currentKm||0)+intervalKm:null;
    state.manualSchedules[scheduleKey(v,id)]=Object.assign({},s,{
      lastDate:today,lastKm:Number(v.currentKm||0),nextDate,nextKm
    });
    save();render();
    alert(item.title+' completed. '+(nextDate||nextKm!==null?'Next reminder recalculated using your chosen repeat interval.':'Enter the next service date or mileage to enable another reminder.'));
  };

  const prevVehicle=renderVehicle,prevHome=renderHome,prevSettings=renderSettings;
  // Custom maintenance schedules now appear exclusively in the current vehicle's Garage view.
  renderVehicle=function(){ prevVehicle(); };
  renderSettings=function(){ prevSettings(); };
  renderHome=function(){
    prevHome();
    const active=state.vehicles.filter(v=>v&&v.type==='car');
    if(!active.length)return;
    const data=[];
    active.forEach(function(v){reminders.forEach(function(item){const st=statusFor(v,item);if(st.type!=='not-set')data.push({v,item,st});});});
    const due=data.filter(x=>x.st.type==='overdue');
    const soon=data.filter(x=>x.st.type==='soon');
    const content='<section><h2>🔔 Wheel Alignment & A/C Reminders</h2>'+
      '<div class="summary"><div><strong>'+data.length+'</strong>Scheduled</div><div><strong>'+due.length+'</strong>Service Due</div><div><strong>'+soon.length+'</strong>Due Soon</div></div>'+
      (data.length?data.map(x=>message(x.v,x.item)).join(''):'<p class="muted">No custom reminders yet. Open Vehicles or Settings to set your dates and mileage.</p>')+
      '<p class="notice">These reminders use your chosen dates and mileage only. A/C flushing and wheel alignment are condition-based, not mandatory routine jobs.</p></section>';
    $('home').insertAdjacentHTML('afterbegin',content);
  };
  const originalRemoveVehicle=removeVehicle;
  removeVehicle=function(){
    const i=slot,had=Boolean(state.vehicles[i]);
    originalRemoveVehicle();
    if(had&&!state.vehicles[i]){
      for(const item of reminders)delete state.manualSchedules[String(i)+'|'+item.id];
      save();render();
    }
  };
  const previousRecord=saveRecord;
  saveRecord=function(){
    const v=state.vehicles[slot];
    const date=$('recDate')?.value, km=$('recKm')?.value;
    const serviced=[...document.querySelectorAll('.itemCheck:checked')].map(x=>x.value);
    const oldLength=state.records.length;
    previousRecord();
    if(state.records.length===oldLength||!v||!date||km==='')return;
    for(const item of reminders) {
      if(!serviced.includes(item.id))continue;
      const old=scheduleFor(v,item.id),months=Number(old.intervalMonths||0),kms=Number(old.intervalKm||0);
      state.manualSchedules[scheduleKey(v,item.id)]=Object.assign({},old,{
        lastDate:date,lastKm:Number(km),
        nextDate:months>0?addMonths(date,months):'',
        nextKm:kms>0?Number(km)+kms:null
      });
    }
    save();render();
  };
  render();
})();
</script>

<!-- Road Tax and Insurance Expiry dashboard v1.2 -->
<script>
(function(){
'use strict';
const expiryItems=[
 {id:'roadTaxExpiry',name:'Road Tax'},
 {id:'insuranceExpiry',name:'Insurance'}
];
function expiryStatus(value){
 if(!value)return {kind:'unset',label:'Not Set',days:null};
 const d=dayDiff(value);
 if(d===null||!Number.isFinite(d))return {kind:'unset',label:'Not Set',days:null};
 if(d<0)return {kind:'expired',label:'Expired',days:d};
 if(d===0)return {kind:'expired',label:'Expires Today',days:0};
 if(d<=30)return {kind:'soon',label:'Expiring Soon',days:d};
 return {kind:'valid',label:'Valid',days:d};
}
function expiryPanel(v){
 const entries=expiryItems.map(e=>({name:e.name,date:v[e.id]||'',status:expiryStatus(v[e.id])}));
 return '<section><h2>📄 Road Tax & Insurance</h2>'+
  entries.map(function(e){
   const s=e.status;
   const rem=s.days===null?'Enter expiry date in Vehicles':s.days<0?(Math.abs(s.days)+' days ago'):s.days===0?'Today':s.days+' days remaining';
   return '<div class="line"><div><strong>'+esc(e.name)+'</strong><br><small>'+
    (e.date?esc(e.date)+' · ':'')+esc(rem)+'</small></div><span class="pill '+
    (s.kind==='expired'?'late':s.kind==='soon'?'warn':'')+'">'+esc(s.label)+'</span></div>';
  }).join('')+
  '<p class="notice">In-app reminders update from the saved dates whenever you open the app. No push or background alerts are sent in this version.</p></section>';
}
const previousHome=renderHome, previousVehicle=renderVehicle;
renderHome=function(){
 previousHome();
 const filled=state.vehicles.filter(Boolean);
 if(!filled.length)return;
 const alerts=[];
 for(const v of filled)for(const i of expiryItems){
   const d=expiryStatus(v[i.id]);
   if(d.kind==='expired'||d.kind==='soon'){
     alerts.push({v,label:i.name,status:d,date:v[i.id]});
   }
 }
 const all=filled.flatMap(v=>expiryItems.map(i=>expiryStatus(v[i.id])));
 const expired=all.filter(s=>s.kind==='expired').length;
 const soon=all.filter(s=>s.kind==='soon').length;
 let section='<section><h2>📅 Road Tax & Insurance Expiry</h2>'+
  '<div class="summary"><div><strong>'+filled.length+'</strong>Vehicles</div><div><strong>'+expired+'</strong>Expired</div><div><strong>'+soon+'</strong>Expiring Soon</div></div>';
 if(alerts.length){
  section+=alerts.map(x=>
   '<div class="line"><div><strong>'+esc(x.v.brand+' '+x.v.model)+' · '+esc(x.label)+'</strong>'+
   '<br><small>'+esc(x.date)+(x.status.days===0?' · Today':x.status.days<0?' · '+Math.abs(x.status.days)+' days overdue':' · '+x.status.days+' days left')+'</small></div>'+
   '<span class="pill '+(x.status.kind==='expired'?'late':'warn')+'">'+esc(x.status.label)+'</span></div>'
  ).join('');
 }else{
  section+='<p class="muted">No expired or expiring-soon entries. Set each date under Vehicles to enable reminders.</p>';
 }
 section+='<p class="notice">Alerts appear in the app starting 30 days before expiry. Make sure to open the app to check your status.</p></section>';
 $('home').insertAdjacentHTML('afterbegin',section);
};
renderVehicle=function(){
 previousVehicle();
 const v=state.vehicles[slot];if(v)$('vehiclePage').insertAdjacentHTML('beforeend',expiryPanel(v));
};
render();
})();
</script>
