<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>My Vehicle Service</title><style>
:root{color-scheme:light;--blue:#1458d1;--ink:#17243c;--grey:#69778b;--bg:#f3f6fb;--border:#e0e6ee}*{box-sizing:border-box}body{font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0}header{background:linear-gradient(120deg,#102b58,#2067dd);color:white;padding:22px 18px 30px}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;opacity:.85}main{padding:12px;max-width:760px;margin:-15px auto 85px}section,.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #10254a08}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}h2{margin:0 0 12px;font-size:17px}h3{margin:6px 0;font-size:15px}small,.muted{color:var(--grey)}label{display:block;margin:12px 0 5px;font-weight:650;font-size:13px}input,select,textarea{width:100%;border:1px solid #ced8e5;border-radius:10px;padding:11px;font:inherit;background:white;color:#1e2b45}input[type=checkbox]{width:auto}button{border:0;border-radius:10px;background:var(--blue);color:white;padding:11px 15px;font-weight:700;font-size:14px;cursor:pointer}button.secondary{background:#e9f0ff;color:#15428f}button.danger{background:#fbe9e8;color:#a12722}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>*{min-width:0}.vehicle{display:flex;align-items:center;justify-content:space-between;text-align:left;background:#fff;border:1px solid var(--border);padding:12px;border-radius:12px;width:100%;margin:7px 0;color:var(--ink)}.vehicle.active{outline:2px solid var(--blue)}.pill{background:#ebf2ff;color:#174c9b;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:750}.pill.warn{background:#ffebd9;color:#a44f00}.pill.late{background:#ffe2e2;color:#af2222}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #eef1f7;padding:10px 0}.line:last-child{border:0}.line>div{flex:1}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--border);z-index:5}nav button{flex:1;border-radius:0;background:white;color:#49627f;padding:11px 2px;font-size:12px}nav button.sel{color:var(--blue);background:#eaf2ff}.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary>div{border:1px solid var(--border);border-radius:11px;padding:10px;text-align:center;font-size:12px}.summary strong{display:block;font-size:17px}.notice{font-size:12px;color:#546780;background:#eef4ff;padding:10px;border-radius:10px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{flex:1}input[type="file"]{font-size:12px} @media(max-width:360px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>🚘 My Vehicle Service</h1><p>Rekod servis sehingga 5 kenderaan • Offline</p></header><main>
<div id="home"></div><div id="vehiclePage" class="hidden"></div><div id="recordPage" class="hidden"></div><div id="settingsPage" class="hidden"></div>
</main><nav><button data-page="home" class="sel">🏠<br>Utama</button><button data-page="vehiclePage">🚗<br>Kenderaan</button><button data-page="recordPage">🧰<br>Rekod Servis</button><button data-page="settingsPage">⚙️<br>Tetapan</button></nav>
<script>
'use strict';
const KEY='my-vehicle-service-v1';
const carBrands=['Perodua','Proton','Toyota','Honda','Mitsubishi','Nissan','Mazda','Hyundai','Kia','Ford','Isuzu','Suzuki','Subaru','Volkswagen','Mercedes-Benz','BMW','Audi','Volvo','Peugeot','Renault','Chery','BYD','Tesla','GWM','Haval','Jaecoo','Omoda','MG','Lexus','Land Rover','Jeep','Mini','Porsche','Jaguar','Infiniti','Chevrolet','Citroen','Fiat','Geely','Changan','GAC','Neta','Ora','Smart','Lamborghini','Ferrari','Bentley','Rolls-Royce','Lain-lain'];
const motoBrands=['Honda','Yamaha','Modenas','SYM','Benelli','Kawasaki','Suzuki','Aveta','WMoto','Yadea','CFMoto','Ducati','BMW Motorrad','KTM','Triumph','Royal Enfield','Vespa','Piaggio','Aprilia','Harley-Davidson','Husqvarna','QJMotor','Brixton','Kymco','Demak','Zontes','Lain-lain'];
const models={Perodua:['Axia','Bezza','Myvi','Alza','Aruz','Ativa','Kancil','Kelisa','Viva','Kenari','Nautica','Rusa'],Proton:['Saga','Persona','Iriz','Exora','X50','X70','X90','S70','Wira','Waja','Preve','Suprima S','Inspira','Satria','Gen-2','Perdana','Iswara','e.MAS 7'],Toyota:['Vios','Yaris','Corolla','Corolla Cross','Camry','Hilux','Fortuner','Innova','Avanza','Veloz','Alphard','Vellfire','Harrier','RAV4','Hiace','Land Cruiser'],Honda:['City','Civic','Accord','Jazz','HR-V','CR-V','BR-V','WR-V','Odyssey','RS150R','RS-X','Wave 110','Wave 125','EX5','Dash 125','Vario 125','Vario 160','ADV 160','PCX','CBR150R','CB650R','Forza 250'],Mitsubishi:['Xpander','Triton','Outlander','ASX','Lancer','Pajero Sport','Grandis','Attrage'],Nissan:['Almera','Serena','Navara','X-Trail','Sylphy','Teana','Grand Livina','Leaf'],Mazda:['Mazda2','Mazda3','Mazda6','CX-3','CX-5','CX-8','CX-30','CX-60','BT-50'],Yamaha:['Y15ZR','Y16ZR','135LC','LC135','NVX','NMAX','Ego','Ego Avantiz','Lagend 115Z','MT-15','R15','XMAX','MT-25'],Modenas:['Kriss 110','Kriss 125','Elegan 250','Pulsar NS200','Dominar D400','Karisma 125','Z15GT'],SYM:['VF3i','Husky 150','Jet 14','Cruisym 250'],Kawasaki:['Ninja 250','Ninja 400','Z250','Z650','Versys 650','ZX-25R'],Suzuki:['Raider R150','GSX-R150','V-Strom 250','Burgman Street 125','Swift','Vitara','Jimny','Ertiga']};
const catalog=[
['engine_oil','Minyak enjin',10000,6,'Ganti','minor','all'],['oil_filter','Penapis minyak enjin',10000,6,'Ganti','minor','all'],['air_filter','Penapis udara enjin',20000,12,'Periksa / ganti jika perlu','minor','all'],['cabin_filter','Penapis kabin aircond',20000,12,'Periksa / ganti','minor','car'],['brake_check','Brek, pad & cakera',10000,6,'Periksa','minor','all'],['tyre_check','Bunga, tekanan & keadaan tayar',10000,6,'Periksa','minor','all'],['tyre_rotate','Rotasi tayar',10000,6,'Ikut corak & jenis tayar','minor','car'],['wheel_alignment','Alignment tayar',10000,12,'Periksa jika tarik sebelah/haus tak sekata/terlanggar lubang','condition','car'],['wheel_balance','Balancing tayar',10000,12,'Jika stereng bergegar / tukar tayar','condition','car'],['ac_filter','Prestasi aircond & cooling',20000,12,'Periksa penyejukan, kebocoran & tekanan','condition','car'],['ac_flush','Aircond flushing',0,0,'Hanya jika didiagnosis tercemar / pembaikan sistem; bukan servis wajib berkala','condition','car'],['brake_fluid','Minyak brek',40000,24,'Uji / ganti ikut manual','major','all'],['coolant','Coolant enjin',40000,24,'Semak spesifikasi & interval model','major','all'],['spark_plug','Spark plug',40000,24,'Jenis iridium mungkin lebih panjang','major','all'],['gear_oil','Minyak gear / CVT / ATF',40000,24,'Ikut jenis transmisi & manual','major','car'],['fuel_filter','Penapis bahan api',40000,24,'Ikut spesifikasi dan simptom','major','all'],['belt','Drive belt / timing belt / chain',60000,48,'Periksa mengikut reka bentuk enjin','major','car'],['battery','Bateri, terminal & charging',10000,12,'Periksa; ganti ikut ujian','condition','all'],['suspension','Absorber, mounting & steering',20000,12,'Periksa kehausan dan kebocoran','condition','all'],['chain','Rantai & sprocket',1000,1,'Bersih/lincir, periksa kehausan','condition','moto'],['chain_tension','Ketegangan rantai',1000,1,'Semak ikut manual','condition','moto'],['fork','Fork oil & fork seal',20000,24,'Periksa/ganti ikut manual','major','moto'],['clutch','Klac & kabel',10000,12,'Periksa & laras','minor','moto'],['valve','Kelegaan injap (valve clearance)',20000,24,'Ikut jadual model','major','moto'],['wheel_bearing','Wheel bearing',20000,12,'Periksa kelonggaran/bunyi','condition','all'],['lights','Lampu, hon & wiper',10000,6,'Periksa; wiper kereta sahaja','minor','all']];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!state||!Array.isArray(state.vehicles)){state={vehicles:Array(5).fill(null),records:[],customIntervals:{}}}while(state.vehicles.length<5)state.vehicles.push(null);state.vehicles=state.vehicles.slice(0,5);state.records=state.records||[];state.customIntervals=state.customIntervals||{};
let slot=0,page='home';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const iso=d=>{const x=new Date(d);return isNaN(x)?'':x.toISOString().slice(0,10)};const addMonths=(str,n)=>{if(!str)return '';const [y,m,d]=str.split('-').map(Number);let date=new Date(y,m-1+n,1);const day=Math.min(d,new Date(date.getFullYear(),date.getMonth()+1,0).getDate());return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(day).padStart(2,'0')].join('-')};const dayDiff=s=>s?Math.ceil((new Date(s+'T12:00:00')-new Date(new Date().toDateString()))/864e5):null;
const typeText=t=>t==='moto'?'Motosikal':'Kereta';const opt=(arr,value='')=>arr.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('');
function due(v,item){const [id,name,km,months,act,cat]=item;const own=state.customIntervals[v.slot+'|'+id];const useKm=own?.km??km,useMo=own?.months??months;const rec=state.records.filter(r=>r.slot===v.slot&&r.items.includes(id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];const baseDate=rec?.date||v.lastDate||'';const baseKm=rec?.km??v.lastKm;const date=useMo&&baseDate?addMonths(baseDate,useMo):'';const mileage=useKm&&baseKm!==''&&baseKm!=null?Number(baseKm)+Number(useKm):null;const remKm=mileage!=null&&v.currentKm!==''?mileage-Number(v.currentKm):null;const remDay=dayDiff(date);const overdue=(remKm!=null&&remKm<=0)||(remDay!=null&&remDay<=0);const soon=!overdue&&((remKm!=null&&remKm<=1000)||(remDay!=null&&remDay<=30));return {date,mileage,remKm,remDay,overdue,soon,category:cat};}
function list(v){return catalog.filter(x=>x[6]==='all'||x[6]===v.type).map(x=>({item:x,...due(v,x)}))}
function guessMajor(v){const ls=list(v).filter(x=>x.category==='major'&&(x.overdue||x.soon));return ls.length?'Major (cadangan berdasarkan item besar yang hampir/luput)':'Minor (cadangan servis asas; semak manual model)'}
function renderHome(){const filled=state.vehicles.filter(Boolean);let past=0,soon=0;filled.forEach(v=>list(v).filter(x=>x.category!=='condition').forEach(x=>{if(x.overdue)past++;else if(x.soon)soon++}));$('home').innerHTML=`<section><h2>Dashboard Servis</h2><div class="summary"><div><strong>${filled.length}/5</strong>Kenderaan</div><div><strong>${past}</strong>Item tertunggak</div><div><strong>${soon}</strong>Item hampir due</div></div><p class="notice">Keputusan servis ialah anggaran umum. Tarikh dan jarak perjalanan diambil yang mana lebih awal. Ikut manual servis mengikut model/tahun serta rekod sebenar.</p></section><section><div class="head"><h2>5 Slot Kenderaan</h2><button class="secondary" onclick="navigate('vehiclePage')">Urus</button></div>${state.vehicles.map((v,i)=>`<button class="vehicle ${i===slot?'active':''}" onclick="slot=${i};navigate('vehiclePage')"><span><strong>${i+1}. ${v?esc(v.brand+' '+v.model):'Tambah kenderaan'}</strong><br><small>${v?esc((v.plate||typeText(v.type))+' • '+v.currentKm+' km'):'Slot kosong'}</small></span><span class="pill">${v?'Buka':'+'}</span></button>`).join('')}</section>${filled.map(v=>{const l=list(v).filter(x=>x.category!=='condition');const od=l.filter(x=>x.overdue).length;const sn=l.filter(x=>x.soon).length;return `<section><div class="head"><strong>${esc(v.brand+' '+v.model)}</strong><span class="pill ${od?'late':sn?'warn':''}">${od?od+' overdue':sn?sn+' hampir due':'Pantau'}</span></div><small>${esc(v.plate)} • ${v.currentKm} km</small><p><strong>${guessMajor(v)}</strong></p><small>Servis berikutnya: ${esc(v.nextDate||'Belum diisi')} • ${v.nextKm||'—'} km</small></section>`}).join('')}`}
function renderVehicle(){const v=state.vehicles[slot];$('vehiclePage').innerHTML=`<section><h2>Pilih slot kenderaan</h2><div class="grid">${state.vehicles.map((x,i)=>`<button class="${i===slot?'':'secondary'}" onclick="slot=${i};renderVehicle()">${i+1} ${x?esc(x.plate||x.model):'Kosong'}</button>`).join('')}</div></section><section><h2>${v?'Kemaskini':'Tambah'} Kenderaan ${slot+1}</h2><form id="vehicleForm"><label>Jenis kenderaan</label><select id="type" onchange="updateBrands()"><option value="car" ${v?.type!=='moto'?'selected':''}>Kereta</option><option value="moto" ${v?.type==='moto'?'selected':''}>Motosikal</option></select><label>Jenama</label><select id="brand" onchange="updateModels()"></select><label>Model (pilih atau taip model lain)</label><select id="modelSelect" onchange="toggleCustom()"></select><input id="customModel" placeholder="Taip nama model" style="margin-top:8px"><div class="grid"><div><label>No. plat</label><input id="plate" value="${esc(v?.plate||'')}" placeholder="JXX 1234"></div><div><label>Tahun</label><input id="year" type="number" min="1950" max="2100" value="${esc(v?.year||'')}" placeholder="2023"></div></div><div class="grid"><div><label>Odometer terkini (km)</label><input id="currentKm" type="number" min="0" value="${esc(v?.currentKm??'')}" required></div><div><label>Odometer servis terakhir (km)</label><input id="lastKm" type="number" min="0" value="${esc(v?.lastKm??'')}"></div></div><label>Tarikh servis terakhir</label><input id="lastDate" type="date" value="${esc(v?.lastDate||'')}"><div class="grid"><div><label>Tarikh servis seterusnya (manual)</label><input id="nextDate" type="date" value="${esc(v?.nextDate||'')}"></div><div><label>Mileage servis seterusnya (manual)</label><input id="nextKm" type="number" min="0" value="${esc(v?.nextKm||'')}"></div></div><p class="notice">Untuk mengira item due secara tepat, lengkapkan tarikh dan mileage terakhir. Tarikh servis seterusnya boleh ditetapkan sendiri mengikut buku servis.</p><div class="actions"><button type="submit">Simpan Kenderaan</button>${v?`<button type="button" class="danger" onclick="removeVehicle()">Padam Slot</button>`:''}</div></form></section>${v?`<section><h2>Cadangan servis</h2><strong>${guessMajor(v)}</strong><div class="line"><div>Tarikh manual: ${esc(v.nextDate||'—')}<br>Mileage manual: ${esc(v.nextKm||'—')} km</div></div>${list(v).filter(x=>x.overdue||x.soon).map(x=>`<div class="line"><div><strong>${esc(x.item[1])}</strong><br><small>${esc(x.item[4])}</small></div><span class="pill ${x.overdue?'late':'warn'}">${x.overdue?'Due':'Hampir'}</span></div>`).join('')||'<p class="muted">Tiada item due yang boleh dikira lagi.</p>'}</section>`:''}`;updateBrands(v?.brand,v?.model);$('vehicleForm').onsubmit=e=>{e.preventDefault();const type=$('type').value;const brand=$('brand').value;const model=$('modelSelect').value==='__other__'?$('customModel').value.trim():$('modelSelect').value;if(!model){alert('Masukkan model kenderaan.');return}const currentKm=$('currentKm').value;const lastKm=$('lastKm').value;if(lastKm!==''&&Number(lastKm)>Number(currentKm)){alert('Mileage servis terakhir tidak boleh melebihi odometer terkini.');return}state.vehicles[slot]={slot,type,brand,model,plate:$('plate').value.trim(),year:$('year').value,currentKm:Number(currentKm),lastKm:lastKm===''?'':Number(lastKm),lastDate:$('lastDate').value,nextDate:$('nextDate').value,nextKm:$('nextKm').value};save();render();alert('Kenderaan disimpan.')};}
function updateBrands(savedBrand,savedModel){const type=$('type').value,all=type==='moto'?motoBrands:carBrands;const brand=savedBrand&&all.includes(savedBrand)?savedBrand:all[0];$('brand').innerHTML=opt(all,brand);updateModels(savedModel)}function updateModels(savedModel){const brand=$('brand').value;let all=(models[brand]||[]).filter(x=>$('type').value==='moto'? /^(RS|Wave|EX5|Dash|Vario|ADV|PCX|CBR|CB650|Forza|Y|LC|NVX|NMAX|Ego|Lagend|MT|R15|XMAX|Kriss|Elegan|Pulsar|Dominar|Karisma|Z15|VF3i|Husky|Jet|Cruisym|Ninja|Z250|Z650|Versys|ZX|Raider|GSX|V-Strom|Burgman)/i.test(x):!/^(RS150|RS-X|Wave|EX5|Dash|Vario|ADV 160|PCX|CBR|CB650|Forza)/i.test(x));if(!all.length)all=['Lain-lain'];const selected=savedModel&&all.includes(savedModel)?savedModel:'__other__';$('modelSelect').innerHTML=opt(all,selected)+`<option value="__other__" ${selected==='__other__'?'selected':''}>Model lain / taip sendiri</option>`;$('customModel').value=savedModel&&selected==='__other__'?savedModel:'';toggleCustom()}function toggleCustom(){$('customModel').classList.toggle('hidden',$('modelSelect').value!=='__other__')}
function removeVehicle(){if(!confirm('Padam kenderaan dan semua rekod servis dalam slot ini?'))return;state.vehicles[slot]=null;state.records=state.records.filter(r=>r.slot!==slot);for(const k in state.customIntervals)if(k.startsWith(slot+'|'))delete state.customIntervals[k];save();render()}
function renderRecords(){const v=state.vehicles[slot];$('recordPage').innerHTML=`<section><h2>Rekod & Checklist Servis</h2><label>Pilih kenderaan</label><select id="rSlot" onchange="slot=Number(this.value);renderRecords()">${state.vehicles.map((x,i)=>`<option value="${i}" ${i===slot?'selected':''}>${i+1}. ${esc(x?x.brand+' '+x.model:'Slot kosong')}</option>`).join('')}</select></section>${!v?'<section>Tambah kenderaan dahulu di tab Kenderaan.</section>':`<section><h2>${esc(v.brand+' '+v.model)}</h2><p><strong>${guessMajor(v)}</strong></p><div class="notice">Checklist di bawah merangkumi servis rutin, servis major dan pemeriksaan ikut keadaan. Item yang telah direkod akan mengira semula due dari tarikh/mileage rekod itu.</div><label>Tarikh servis dibuat</label><input id="recDate" type="date" value="${iso(new Date())}"><label>Odometer servis (km)</label><input id="recKm" type="number" min="0" value="${v.currentKm}"><label>Jenis servis sebenar</label><select id="recType"><option>Minor</option><option>Major</option><option>Pemeriksaan / kerja lain</option></select><label>Nama bengkel</label><input id="workshop" placeholder="Contoh: Mitsubishi Service Centre"><div class="grid"><div><label>Jumlah kos (RM)</label><input id="cost" type="number" min="0" step="0.01" placeholder="0.00"></div><div><label>No. resit (jika ada)</label><input id="receipt" placeholder="Rujukan"></div></div><label>Nota</label><textarea id="notes" rows="2" placeholder="Minyak enjin, masalah dijumpai, alat ganti..."></textarea><h3 style="margin-top:18px">Pilih item yang dibuat/diganti</h3><div class="actions"><button class="secondary" onclick="checkGroup('all')">Pilih semua</button><button class="secondary" onclick="checkGroup('none')">Kosongkan</button></div>${list(v).map(x=>`<div class="line"><input type="checkbox" class="itemCheck" value="${x.item[0]}"><div><strong>${esc(x.item[1])}</strong><br><small>${esc(x.item[4])}</small><br><small>${x.date?'Anggaran: '+x.date+' • ':''}${x.mileage!=null?x.mileage+' km':''}</small></div><span class="pill ${x.overdue?'late':x.soon?'warn':''}">${x.overdue?'DUE':x.soon?'HAMPIR':x.category==='major'?'Major':x.category==='minor'?'Minor':'Ikut kondisi'}</span></div>`).join('')}<div class="actions"><button onclick="saveRecord()">Simpan Rekod Servis</button></div></section><section><h2>Sejarah servis</h2>${state.records.filter(r=>r.slot===slot).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="line"><div><strong>${esc(r.date)} • ${esc(r.type)}</strong><br><small>${r.km} km • RM${Number(r.cost||0).toFixed(2)} • ${esc(r.workshop)}</small><br><small>${esc(r.items.map(id=>catalog.find(x=>x[0]===id)?.[1]||id).join(', ')||'Tiada item')}</small><br><small>${esc(r.notes||'')}</small></div><button class="danger" onclick="deleteRecord('${r.id}')">Padam</button></div>`).join('')||'<p class="muted">Belum ada rekod servis.</p>'}</section>`}`}
function checkGroup(how){document.querySelectorAll('.itemCheck').forEach(x=>x.checked=how==='all')}
function saveRecord(){const v=state.vehicles[slot];const date=$('recDate').value,km=Number($('recKm').value);if(!date||$('recKm').value===''){alert('Tarikh dan odometer diperlukan.');return}if(km<0){alert('Mileage tidak sah.');return}const items=[...document.querySelectorAll('.itemCheck:checked')].map(x=>x.value);state.records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),slot,date,km,items,type:$('recType').value,workshop:$('workshop').value,cost:$('cost').value,receipt:$('receipt').value,notes:$('notes').value});if(km>Number(v.currentKm))v.currentKm=km;v.lastDate=date;v.lastKm=km;save();render();alert('Rekod servis berjaya disimpan.')}
function deleteRecord(id){if(!confirm('Padam rekod ini?'))return;state.records=state.records.filter(r=>r.id!==id);save();render()}
function renderSettings(){const v=state.vehicles[slot];$('settingsPage').innerHTML=`<section><h2>Tetapan</h2><p class="notice">Interval bawah ialah panduan permulaan sahaja. Bergantung kepada jenis enjin, minyak, transmission, tahun dan penggunaan. Ubah mengikut buku manual model sebenar. Untuk minyak enjin motosikal, sila set semula interval yang sesuai.</p><label>Ubah interval untuk kenderaan</label><select id="sSlot" onchange="slot=Number(this.value);renderSettings()">${state.vehicles.map((x,i)=>`<option value="${i}" ${i===slot?'selected':''}>${i+1}. ${esc(x?x.brand+' '+x.model:'Slot kosong')}</option>`).join('')}</select>${v?list(v).map(x=>{let own=state.customIntervals[slot+'|'+x.item[0]];return `<div class="line"><div><strong>${esc(x.item[1])}</strong><small style="display:block">${esc(x.item[4])}</small><div class="grid"><div><label>Setiap km (0 = tiada)</label><input id="km_${x.item[0]}" type="number" min="0" value="${own?.km??x.item[2]}"></div><div><label>Setiap bulan (0 = tiada)</label><input id="mo_${x.item[0]}" type="number" min="0" value="${own?.months??x.item[3]}"></div></div></div></div>`}).join('')+`<div class="actions"><button onclick="saveIntervals()">Simpan Interval</button></div>`:'<p>Isi kenderaan sebelum menetapkan interval.</p>'}</section><section><h2>Backup & Pemulihan</h2><p class="muted">Data hanya tersimpan dalam telefon ini. Buat backup sebelum uninstall atau bertukar telefon.</p><div class="actions"><button onclick="exportData()">Eksport Backup JSON</button></div><label>Import backup JSON</label><input type="file" id="importFile" accept="application/json,.json"><button class="secondary" style="margin-top:8px" onclick="importData()">Import Backup</button></section><section><h2>Nota keselamatan</h2><p class="muted">Major/minor ialah cadangan, bukan pengganti jadual pengeluar. Aircond flushing biasanya tidak perlu secara berkala jika sistem normal. Alignment & balancing disaran berdasarkan simptom, selepas kerja tayar/suspensi atau pemeriksaan. Sesetengah kenderaan elektrik atau model khusus mempunyai item berbeza.</p></section>`}
function saveIntervals(){if(!state.vehicles[slot])return;list(state.vehicles[slot]).forEach(x=>{const id=x.item[0],km=Number($('km_'+id).value),months=Number($('mo_'+id).value);if(Number.isFinite(km)&&Number.isFinite(months)&&km>=0&&months>=0)state.customIntervals[slot+'|'+id]={km,months}});save();render();alert('Interval disimpan.')}
function exportData(){const data=JSON.stringify(state,null,2);const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);a.download='my-vehicle-service-backup.json';a.click()}
function importData(){const f=$('importFile').files[0];if(!f){alert('Pilih fail JSON dahulu.');return}const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);if(!Array.isArray(imported.vehicles)||!Array.isArray(imported.records)||imported.vehicles.length>5)throw Error('Format tidak sah');if(!confirm('Import akan menggantikan semua rekod semasa. Teruskan?'))return;state={vehicles:imported.vehicles.concat(Array(5).fill(null)).slice(0,5).map((v,i)=>v?{...v,slot:i}:null),records:imported.records,customIntervals:imported.customIntervals||{}};save();render();alert('Backup berjaya diimport.')}catch(e){alert('Fail backup tidak sah: '+e.message)}};r.readAsText(f)}
function navigate(p){page=p;render()}function render(){['home','vehiclePage','recordPage','settingsPage'].forEach(x=>$(x).classList.toggle('hidden',x!==page));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('sel',x.dataset.page===page));renderHome();if(page==='vehiclePage')renderVehicle();if(page==='recordPage')renderRecords();if(page==='settingsPage')renderSettings();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));render();
</script></body></html>
